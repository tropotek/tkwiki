name: tkwiki

x-vols: &app_vols
  volumes:
    - ./:/app
    - ./docker/php.ini:/usr/local/etc/php/conf.d/99-moodle.ini

services:
  app:
    build:
      context: .
    tty: true
    env_file:
      - ./.env
    restart: always
    ports:
      - "${HTTP_APP_PORT:-80}:80"
      - "${HTTPS_APP_PORT:-443}:443"
      - "${HTTPS_APP_PORT:-443}:443/udp"
    <<: *app_vols
    depends_on:
      - db

  db:
    image: mariadb:latest
    restart: unless-stopped
    tty: true
    env_file:
      - ./.env
    ports:
      - '${DB_MARIADB_PORT:-3306}:3306'
    volumes:
      - ./docker/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 3
      timeout: 5s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    tty: true
    volumes:
      - ./docker/mailpit:/data
    ports:
      - "${HTTP_MAILPIT_PORT:-8025}:8025" # Web UI
      - "${SMTP_MAILPIT_PORT:-1025}:1025" # SMTP server
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  caddy_data:
  caddy_config:
